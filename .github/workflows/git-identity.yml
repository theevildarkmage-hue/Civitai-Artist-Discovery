name: Git identity privacy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
jobs:
  audit:
    name: git-identity-privacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only trusted default-branch policy is checked out. PR contents stay Git
      # objects and are never executed, imported, built or checked out.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Audit authors, committers, taggers and introduced objects
        env:
          DISCOVERY_IDENTITY_POLICY: ${{ secrets.DISCOVERY_IDENTITY_POLICY }}
        run: python3 scripts/check-git-identity.py --github-event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME"
